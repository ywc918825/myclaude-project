<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#fff}
  svg{display:block}
  text{font-family:"Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Zen Hei",sans-serif;fill:#000}
  .layer{fill:none;stroke:#000;stroke-width:1.2}
  .lname{font-size:14px;font-weight:700}
  .box{fill:#fff;stroke:#000;stroke-width:1.2}
  .bt{font-size:13px;text-anchor:middle}
  .bs{font-size:11px;text-anchor:middle}
  .ar{stroke:#000;stroke-width:1.1;fill:none;marker-end:url(#a)}
</style>
<svg width="600" height="482" viewBox="0 0 600 482" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#000"/>
    </marker>
  </defs>

  <!-- 表现层 -->
  <rect class="layer" x="20" y="16" width="560" height="86" rx="4"/>
  <text class="lname" x="32" y="36">表现层</text>
  <rect class="box" x="215" y="44" width="170" height="46"/>
  <text class="bt" x="300" y="63">Controller</text>
  <text class="bs" x="300" y="80">接收、响应 HTTP 请求</text>

  <!-- 业务逻辑层 -->
  <rect class="layer" x="20" y="132" width="560" height="96" rx="4"/>
  <text class="lname" x="32" y="152">业务逻辑层</text>
  <rect class="box" x="52" y="162" width="144" height="52"/>
  <text class="bt" x="124" y="182">系统服务</text>
  <text class="bs" x="124" y="200">用户、权限管理</text>
  <rect class="box" x="228" y="162" width="144" height="52"/>
  <text class="bt" x="300" y="182">画像服务</text>
  <text class="bs" x="300" y="200">标签、画像生成</text>
  <rect class="box" x="404" y="162" width="144" height="52"/>
  <text class="bt" x="476" y="182">积分服务</text>
  <text class="bs" x="476" y="200">计算、审核、排行</text>

  <!-- 数据访问层 -->
  <rect class="layer" x="20" y="258" width="560" height="86" rx="4"/>
  <text class="lname" x="32" y="278">数据访问层</text>
  <rect class="box" x="52" y="288" width="144" height="42"/>
  <text class="bt" x="124" y="314">人才 Mapper</text>
  <rect class="box" x="228" y="288" width="144" height="42"/>
  <text class="bt" x="300" y="314">标签 Mapper</text>
  <rect class="box" x="404" y="288" width="144" height="42"/>
  <text class="bt" x="476" y="314">积分 Mapper</text>

  <!-- 数据层 -->
  <rect class="layer" x="20" y="374" width="560" height="96" rx="4"/>
  <text class="lname" x="32" y="394">数据层</text>
  <path class="box" d="M214,412 v30 a86,11 0 0 0 172,0 v-30 a86,11 0 0 0 -172,0 z"/>
  <path d="M214,412 a86,11 0 0 0 172,0" fill="none" stroke="#000" stroke-width="1.2"/>
  <text class="bt" x="300" y="437">MySQL 数据库</text>

  <!-- 层间箭头 -->
  <path class="ar" d="M300,90 v66"/>
  <path class="ar" d="M285,90 C220,110 150,130 124,156"/>
  <path class="ar" d="M315,90 C380,110 450,130 476,156"/>
  <path class="ar" d="M124,214 v68"/>
  <path class="ar" d="M300,214 v68"/>
  <path class="ar" d="M476,214 v68"/>
  <path class="ar" d="M124,330 C160,352 210,380 232,398"/>
  <path class="ar" d="M300,330 v70"/>
  <path class="ar" d="M476,330 C440,352 390,380 368,398"/>
</svg>
